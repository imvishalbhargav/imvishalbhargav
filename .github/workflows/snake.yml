name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # har 12 ghante auto-update
  workflow_dispatch:          # manually bhi chala sakte ho (Actions tab)

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#B45309&color_dots=#ebedf0,#fde68a,#fbbf24,#f59e0b,#b45309
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FDE047&color_dots=#1b1f27,#553f06,#8a6d0a,#c79f10,#FDE047

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
