name: 3D Contribution Calendar

# Generates an isometric 3D contribution chart and commits the SVGs to
# profile-3d-contrib/ on main. Self-hosted => never breaks like public widgets.
on:
  schedule:
    - cron: "17 3 * * *"     # daily rebuild
  workflow_dispatch:          # run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: update 3D contribution calendar [skip ci]" || echo "no changes"
          git push
